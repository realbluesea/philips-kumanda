name: APK Derle
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Proje dosyalarini olustur
        run: |
          mkdir -p app/src/main/java/com/example/philipsremote
          cat > settings.gradle.kts <<'EOF1'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PhilipsRemote"
          include(":app")
          EOF1
          cat > build.gradle.kts <<'EOF1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF1
          cat > gradle.properties <<'EOF1'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF1
          cat > app/build.gradle.kts <<'EOF1'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.philipsremote"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.philipsremote"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF1
          cat > app/src/main/AndroidManifest.xml <<'EOF1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.TRANSMIT_IR"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-feature android:name="android.hardware.consumerir" android:required="false"/>
              <application android:label="Philips Kumanda"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF1
          cat > app/src/main/java/com/example/philipsremote/MainActivity.kt <<'EOF1'
          package com.example.philipsremote

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.hardware.ConsumerIrManager
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.text.SpannableString
          import android.text.Spanned
          import android.text.style.RelativeSizeSpan
          import android.view.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private var ir: ConsumerIrManager? = null
              private var toggle = 0

              // Philips RC6 mode 0, adres 0 (TV), 36 kHz
              private val T = 444
              private fun rc6(cmd: Int): IntArray {
                  val h = ArrayList<Boolean>()
                  repeat(6) { h.add(true) }; repeat(2) { h.add(false) }
                  h.add(true); h.add(false)
                  repeat(3) { h.add(false); h.add(true) }
                  if (toggle == 0) { h.addAll(listOf(false, false, true, true)) }
                  else { h.addAll(listOf(true, true, false, false)) }
                  val bits = (0 shl 8) or cmd
                  for (i in 15 downTo 0) {
                      if ((bits shr i) and 1 == 1) { h.add(true); h.add(false) }
                      else { h.add(false); h.add(true) }
                  }
                  val out = ArrayList<Int>()
                  var cur = h[0]; var n = 0
                  for (x in h) { if (x == cur) n++ else { out.add(n * T); cur = x; n = 1 } }
                  out.add(n * T)
                  return out.toIntArray()
              }

              private fun send(cmd: Int) {
                  val m = ir
                  if (m == null || !m.hasIrEmitter()) {
                      Toast.makeText(this, "Bu telefonda IR verici yok", Toast.LENGTH_SHORT).show(); return
                  }
                  m.transmit(36000, rc6(cmd))
                  toggle = 1 - toggle
                  (getSystemService(Context.VIBRATOR_SERVICE) as Vibrator)
                      .vibrate(VibrationEffect.createOneShot(25, VibrationEffect.DEFAULT_AMPLITUDE))
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun lp(w: Int, h: Int, m: Int = 6): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(dp(w), dp(h))
                  p.setMargins(dp(m), dp(m), dp(m), dp(m))
                  return p
              }

              private fun key(label: CharSequence, code: Int, color: Int, size: Float = 18f): TextView {
                  val b = TextView(this)
                  b.text = label
                  b.gravity = Gravity.CENTER
                  b.setTextColor(Color.WHITE)
                  b.textSize = size
                  b.typeface = Typeface.DEFAULT_BOLD
                  val bg = GradientDrawable()
                  bg.setColor(color)
                  bg.cornerRadius = dp(40).toFloat()
                  b.background = bg
                  b.layoutParams = lp(64, 64)
                  b.setOnTouchListener { v, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              v.animate().scaleX(0.9f).scaleY(0.9f).setDuration(60).start()
                              send(code)
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL ->
                              v.animate().scaleX(1f).scaleY(1f).setDuration(60).start()
                      }
                      true
                  }
                  return b
              }

              private fun sp(): View {
                  val s = Space(this)
                  s.layoutParams = lp(64, 64)
                  return s
              }

              private fun pill(title: String, plus: Int, minus: Int): LinearLayout {
                  val p = LinearLayout(this)
                  p.orientation = LinearLayout.VERTICAL
                  p.gravity = Gravity.CENTER
                  val bg = GradientDrawable()
                  bg.setColor(0xFF2A2D36.toInt())
                  bg.cornerRadius = dp(40).toFloat()
                  p.background = bg
                  p.addView(key("+", plus, Color.TRANSPARENT, 26f), lp(64, 56, 2))
                  val t = TextView(this)
                  t.text = title
                  t.textSize = 11f
                  t.setTextColor(0xFF9AA0AC.toInt())
                  t.gravity = Gravity.CENTER
                  p.addView(t, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  p.addView(key("−", minus, Color.TRANSPARENT, 26f), lp(64, 56, 2))
                  val l = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  l.setMargins(dp(24), 0, dp(24), 0)
                  p.layoutParams = l
                  return p
              }

              private fun two(sym: String, name: String): CharSequence {
                  val t = SpannableString(sym + "\n" + name)
                  t.setSpan(RelativeSizeSpan(1.8f), 0, sym.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                  return t
              }

              private fun mk(label: CharSequence, code: Int): TextView {
                  val k = key(label, code, 0xFF2A2D36.toInt(), 8f)
                  k.layoutParams = lp(56, 56, 2)
                  return k
              }

              private fun hrow(vararg v: View): LinearLayout {
                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  r.gravity = Gravity.CENTER
                  for (x in v) r.addView(x)
                  return r
              }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  ir = getSystemService(Context.CONSUMER_IR_SERVICE) as? ConsumerIrManager
                  val bgColor = 0xFF14161B.toInt()
                  window.statusBarColor = bgColor

                  val dark = 0xFF2A2D36.toInt()
                  val arrow = 0xFF343944.toInt()

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.gravity = Gravity.CENTER_HORIZONTAL
                  root.setBackgroundColor(bgColor)
                  root.setPadding(dp(12), dp(24), dp(12), dp(24))

                  root.addView(hrow(
                      key("AÇ/KAPA", 12, 0xFFE53935.toInt(), 11f),
                      key("KAYNAK", 56, dark, 11f),
                      key("SESSİZ", 13, dark, 11f)))

                  val atv = key("ANDROID TV", 84, 0xFF00897B.toInt(), 13f)
                  atv.layoutParams = lp(220, 48, 6)
                  root.addView(hrow(atv))

                  val pad = LinearLayout(this)
                  pad.orientation = LinearLayout.VERTICAL
                  pad.gravity = Gravity.CENTER
                  val pbg = GradientDrawable()
                  pbg.setColor(0xFF1E2128.toInt())
                  pbg.cornerRadius = dp(48).toFloat()
                  pad.background = pbg
                  pad.setPadding(dp(8), dp(8), dp(8), dp(8))
                  pad.addView(hrow(sp(), key(two("▲", "YUKARI"), 88, arrow, 9f), sp()))
                  pad.addView(hrow(key(two("◀", "SOL"), 90, arrow, 9f), key("OK", 92, 0xFF3F51B5.toInt()), key(two("▶", "SAĞ"), 91, arrow, 9f)))
                  pad.addView(hrow(sp(), key(two("▼", "AŞAĞI"), 89, arrow, 9f), sp()))
                  val padLp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  padLp.setMargins(0, dp(16), 0, dp(16))
                  root.addView(pad, padLp)

                  root.addView(hrow(
                      key("GERİ", 10, dark, 11f),
                      key("ANA", 84, dark, 11f),
                      key("BİLGİ", 15, dark, 11f)))

                  root.addView(hrow(
                      mk(two("◀◀", "GERİ"), 43), mk(two("▶", "OYNAT"), 44), mk(two("II", "DURAKLAT"), 48), mk(two("■", "DUR"), 49), mk(two("▶▶", "İLERİ"), 40)))

                  val pills = hrow(pill("SES", 16, 17), pill("KANAL", 32, 33))
                  pills.setPadding(0, dp(12), 0, dp(12))
                  root.addView(pills)

                  root.addView(hrow(key("1", 1, dark, 20f), key("2", 2, dark, 20f), key("3", 3, dark, 20f)))
                  root.addView(hrow(key("4", 4, dark, 20f), key("5", 5, dark, 20f), key("6", 6, dark, 20f)))
                  root.addView(hrow(key("7", 7, dark, 20f), key("8", 8, dark, 20f), key("9", 9, dark, 20f)))
                  root.addView(hrow(key("0", 0, dark, 20f)))

                  val scroll = ScrollView(this)
                  scroll.setBackgroundColor(bgColor)
                  scroll.isFillViewport = true
                  scroll.addView(root)
                  setContentView(scroll)
              }
          }
          EOF1
      - name: Derle
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhilipsKumanda-APK
          path: app/build/outputs/apk/debug/app-debug.apk
